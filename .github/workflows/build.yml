name: Build TmrHiroStudio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package Windows 10 x64
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application
        run: dotnet restore src/TmrHiroStudio/TmrHiroStudio.csproj

      - name: Restore regression tests
        run: dotnet restore tests/TmrHiroStudio.Tests/TmrHiroStudio.Tests.csproj

      - name: Build Release x64
        run: dotnet build src/TmrHiroStudio/TmrHiroStudio.csproj --configuration Release -p:Platform=x64 --no-restore

      - name: Build regression tests
        run: dotnet build tests/TmrHiroStudio.Tests/TmrHiroStudio.Tests.csproj --configuration Release -p:Platform=x64 --no-restore

      - name: Run format regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testExe = Get-ChildItem -Path 'tests/TmrHiroStudio.Tests/bin' -Filter 'TmrHiroStudio.Tests.exe' -Recurse -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $testExe) {
            throw 'Regression test executable was not found.'
          }
          & $testExe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Regression tests failed with exit code $LASTEXITCODE."
          }

      - name: Prepare portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $PWD 'src/TmrHiroStudio/bin/x64/Release/net48/TmrHiroStudio.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            $exeItem = Get-ChildItem -Path 'src/TmrHiroStudio/bin' -Filter 'TmrHiroStudio.exe' -Recurse -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $exeItem) {
              throw 'Build succeeded but TmrHiroStudio.exe was not found.'
            }
            $exe = $exeItem.FullName
          }

          $package = Join-Path $PWD 'artifacts/TmrHiroStudio-Win10-x64'
          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          Copy-Item $exe (Join-Path $package 'TmrHiroStudio.exe') -Force

          $config = $exe + '.config'
          if (Test-Path $config -PathType Leaf) {
            Copy-Item $config (Join-Path $package 'TmrHiroStudio.exe.config') -Force
          }

          $puaMap = Join-Path $PWD 'src/TmrHiroStudio/cp932-pua-map.tsv'
          if (-not (Test-Path $puaMap -PathType Leaf)) {
            throw 'Required cp932-pua-map.tsv is missing.'
          }
          Copy-Item $puaMap (Join-Path $package 'cp932-pua-map.tsv') -Force

          Copy-Item 'README.md' $package -Force
          Copy-Item 'LICENSE' $package -Force
          Copy-Item 'THIRD_PARTY_NOTICES.md' $package -Force

          Write-Host 'Portable package contents:'
          Get-ChildItem -Path $package -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: TmrHiroStudio-Win10-x64
          path: artifacts/TmrHiroStudio-Win10-x64/
          if-no-files-found: error
          retention-days: 30

